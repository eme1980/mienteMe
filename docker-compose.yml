services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./wp-content:/var/www/html/wp-content
    networks:
      - internal
      - dokploy-network
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    labels:
      - "traefik.enable=true"
      
      # --- CONFIGURACIÓN DEL ROUTER (TU DOMINIO) ---
      # Usamos OR (||) para aceptar tanto la variable como el dominio fijo
      - "traefik.http.routers.mienteme-router.rule=Host(`${DOMAIN_NAME}`) || Host(`mienteme.es`)"
      - "traefik.http.routers.mienteme-router.entrypoints=websecure"
      - "traefik.http.routers.mienteme-router.tls.certresolver=letsencrypt"
      
      # --- LA SOLUCIÓN AL ERROR DE MULTIPLES SERVICIOS ---
      # 1. Definimos un nombre ÚNICO para tu servicio interno ("mienteme-svc")
      - "traefik.http.routers.mienteme-router.service=mienteme-svc"
      
      # 2. Configuramos ese servicio específico apuntando al puerto 80
      - "traefik.http.services.mienteme-svc.loadbalancer.server.port=80"
      
      # 3. Red de Traefik
      - "traefik.docker.network=dokploy-network"

volumes:
  db_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true