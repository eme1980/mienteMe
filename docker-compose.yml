services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    environment:
      # Aquí usamos las variables tal cual las tienes en tu .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./wp-content:/var/www/html/wp-content
    networks:
      - internal
      - dokploy-network
    environment:
      WORDPRESS_DB_HOST: db:3306
      # ¡OJO AQUÍ! Usamos las mismas variables de MYSQL para asegurar que coinciden.
      # WordPress debe conectarse con el mismo usuario que creó la base de datos.
      WORDPRESS_DB_USER: ${MYSQL_USER}      # Usará 'wp_user'
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD} # Usará 'ev8Uryoa'
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}     # Usará 'mienteme_db'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mienteme.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.mienteme.entrypoints=websecure"
      - "traefik.http.routers.mienteme.tls.certresolver=letsencrypt"
      - "traefik.http.services.mienteme.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"

volumes:
  db_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true