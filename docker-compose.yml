services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    restart: unless-stopped
    ports:
      - "8080:80" # Puerto para acceso local (localhost:8080)
    volumes:
      - ./wp-content:/var/www/html/wp-content # Mapea tu código local
    networks:
      - internal
      - dokploy-network
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mienteme.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.mienteme.entrypoints=websecure"
      - "traefik.http.routers.mienteme.tls.certresolver=letsencrypt"
      - "traefik.http.services.mienteme.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"

volumes:
  db_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true